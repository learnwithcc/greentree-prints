<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout cancelled — Greentree Prints</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 30'%3E%3Crect x='10' y='24' width='6' height='5' rx='1.5' fill='%23A9683B'/%3E%3Crect x='4' y='19' width='18' height='4' rx='2' fill='%232E5138'/%3E%3Crect x='6' y='14' width='14' height='4' rx='2' fill='%233E9159'/%3E%3Crect x='8' y='9' width='10' height='4' rx='2' fill='%234CAF6D'/%3E%3Crect x='10' y='4' width='6' height='4' rx='2' fill='%2357B577'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F0F1E3;--ink:#22392E;--spruce:#2E5138;--cedar:#A9683B;--gold:#E9A13B;--gold-deep:#C9821E;--line:rgba(34,57,46,.16);--shadow:0 2px 6px rgba(34,57,46,.08), 0 12px 32px rgba(34,57,46,.10)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Karla',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased}
  h1{font-family:'Bricolage Grotesque',sans-serif;line-height:1.12;letter-spacing:-.01em;font-size:clamp(1.7rem,5vw,2.4rem);font-weight:800;margin:10px 0 12px}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--spruce)}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;padding-top:14px;padding-bottom:14px}
  .wordmark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .wordmark b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.05rem}
  .wm-text{display:flex;flex-direction:column;line-height:1.15}
  .wm-sub{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:#965C34}
  main{padding:48px 0 72px}
  .panel{background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:18px;padding:30px 24px;box-shadow:var(--shadow)}
  @media(min-width:640px){.panel{padding:38px 36px}}
  p{color:#3A5245;margin-top:10px}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Karla',sans-serif;font-weight:700;font-size:1rem;padding:14px 22px;border-radius:999px;border:2px solid transparent;text-decoration:none;min-height:48px}
  .btn-gold{background:var(--gold);color:#2B1E07;box-shadow:0 2px 0 var(--gold-deep)}
  .btn-gold:hover{background:#F0AC48}
  .btn-ghost{color:var(--ink);border-color:var(--ink)}
  .btn-ghost:hover{background:rgba(34,57,46,.06)}
  .btn:focus-visible{outline:3px solid rgba(76,175,109,.55);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="wordmark" href="/" aria-label="Greentree Prints home">
      <svg width="26" height="30" viewBox="0 0 26 30" fill="none" aria-hidden="true">
        <rect x="10" y="24" width="6" height="5" rx="1.5" fill="#A9683B"/>
        <rect x="4" y="19" width="18" height="4" rx="2" fill="#2E5138"/>
        <rect x="6" y="14" width="14" height="4" rx="2" fill="#3E9159"/>
        <rect x="8" y="9" width="10" height="4" rx="2" fill="#4CAF6D"/>
        <rect x="10" y="4" width="6" height="4" rx="2" fill="#57B577"/>
      </svg>
      <span class="wm-text"><b>Greentree Prints</b><span class="wm-sub">3D print studio</span></span>
    </a>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="panel">
      <span class="mono">Checkout cancelled</span>
      <h1>No problem, nothing was charged.</h1>
      <p>Your order is still filled in if you want to change something and try again. Or send a question first and I'll help you work out what you need.</p>
      <div class="actions">
        <a class="btn btn-gold" href="/order">Back to your order</a>
        <a class="btn btn-ghost" href="/#request">Ask a question instead</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
